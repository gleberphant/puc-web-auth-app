# Action para testes unitários do backend Go
name: Testes Unitários Backend

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  testes-unitarios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download dependências
        working-directory: api-go
        run: go mod download

      - name: Executar testes unitários
        working-directory: api-go
        run: go test -v ./...

      - name: Verificar coverage
        working-directory: api-go
        run: go test -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | tail -1