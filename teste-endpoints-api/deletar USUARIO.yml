info:
  name: deletar USUARIO
  type: http
  seq: 6

http:
  method: POST
  url: http://localhost:4000/usuarios
  body:
    type: json
    data: |-
      {
        "Uid": "{{$randomUUID}}",
        "Login": "{{$randomEmail}}",
        "Senha": "{{$randomPassword}}",
        "Nome": "{{$randomFullName}}",
        "Perfil": "usuario"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
